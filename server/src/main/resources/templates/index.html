<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('검사 시작')}"></head>
<body>
<a th:replace="~{fragments/common :: skip}"></a>
<header th:replace="~{fragments/common :: header}"></header>

<main id="main" class="container">
  <section class="hero">
    <h1>웹사이트 품질 검사</h1>
    <p class="lead">홈페이지 주소를 넣으면 깨진 링크·이미지, 화면 동작 오류, 휴대폰 화면 깨짐,
      장애인·고령자 이용 편의(접근성)까지 한 번에 검사합니다.</p>

    <form class="scan-form card" th:action="@{/scans}" method="post">
      <label for="url" class="form-label">검사할 주소</label>
      <div class="input-row">
        <input id="url" name="url" type="text" inputmode="url" autocomplete="url"
               placeholder="https://www.example.com" required
               th:value="${url}"
               th:attr="aria-invalid=${error != null}, aria-describedby=${error != null ? 'url-help url-error' : 'url-help'}">
        <button type="submit" class="btn btn-primary">검사 시작</button>
      </div>
      <p id="url-help" class="help">www.로 시작하는 주소만 넣어도 됩니다. 입력한 페이지 1개를 검사합니다.</p>
      <p id="url-error" class="form-error" role="alert" th:if="${error}" th:text="${error}">오류 메시지</p>

      <label class="check">
        <input type="checkbox" name="lighthouse" value="true" th:checked="${lighthouse}">
        <span>로딩 속도 · 검색 노출 점수도 측정 <span class="muted">(20~60초 더 걸림)</span></span>
      </label>
    </form>
  </section>

  <section class="recent" th:unless="${#lists.isEmpty(recent)}">
    <h2>최근 검사</h2>
    <div class="table-wrap">
      <table class="table">
        <caption class="sr-only">최근 검사 목록</caption>
        <thead>
          <tr>
            <th scope="col">시각</th>
            <th scope="col">주소</th>
            <th scope="col">상태</th>
            <th scope="col" class="num">발견된 문제</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="j : ${recent}">
            <td class="nowrap" th:text="${#temporals.format(j.createdAt, 'MM-dd HH:mm:ss')}">11-16 14:20:00</td>
            <td class="url-cell"><a th:href="@{/scans/{id}(id=${j.id})}" th:text="${j.url}">https://www.example.com</a></td>
            <td><span class="status" th:classappend="${'status-' + #strings.toLowerCase(j.status.name())}" th:text="${j.status.label}">완료</span></td>
            <td class="num" th:text="${j.report != null ? j.report.summary.total + '건' : '-'}">12건</td>
          </tr>
        </tbody>
      </table>
    </div>
    <p class="muted small">검사 기록은 프로그램을 다시 켜면 사라집니다 (기록 저장 기능은 다음 단계).</p>
  </section>
</main>
</body>
</html>
