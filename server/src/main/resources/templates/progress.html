<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(${job.finished} ? '검사 실패' : '검사 중')}"></head>
<body>
<a th:replace="~{fragments/common :: skip}"></a>
<header th:replace="~{fragments/common :: header}"></header>

<main id="main" class="container narrow">
  <!-- 진행 중 -->
  <section class="card progress-card" th:unless="${job.finished}">
    <h1>검사 중입니다</h1>
    <p class="target" th:text="${job.url}">https://www.example.com</p>
    <span class="scope-tag" th:text="${job.siteScan} ? ${job.scope.label} + ' · 게시판 글 ' + ${job.postsLabel} : ${job.scope.label}">메인 페이지만</span>

    <!-- 진행 막대: 웹사이트 전체 점검은 페이지를 다 찾은 뒤 '페이지 n / 전체'로, 한 페이지는 검사 단계로 채운다 -->
    <div class="pbar-head">
      <strong class="pbar-pct" id="pct" th:text="${job.indeterminate} ? '' : ${job.percent} + '%'">12%</strong>
      <span class="pbar-step" id="step-text" role="status" aria-live="polite" th:text="${job.stepText}">페이지 3 / 9 검사 완료</span>
    </div>
    <div class="pbar" id="pbar" role="progressbar" aria-label="검사 진행률" aria-valuemin="0" aria-valuemax="100"
         th:attr="aria-valuenow=${job.percent}" th:classappend="${job.indeterminate} ? 'is-indeterminate'">
      <div class="pbar-fill" id="pbar-fill" th:style="'width:' + ${job.percent} + '%'"></div>
    </div>
    <p class="progress-text" id="progress" th:text="${job.progress}">접근성 검사 중</p>
    <p class="muted small" th:if="${job.siteScan}"
       th:text="'웹사이트 전체 점검: 같은 사이트 링크를 끝까지 따라가며 검사합니다 (최대 ' + ${job.maxPages} + '페이지, 탭 여러 개로 동시에). 사이트 크기에 따라 수십 분 걸릴 수 있습니다.'">웹사이트 전체 점검</p>
    <p class="muted small" th:if="${!job.siteScan and job.lighthouse}">로딩 속도 · 검색 노출 측정을 포함해 1분 정도 걸릴 수 있습니다.</p>
    <p class="muted small" th:if="${!job.siteScan and !job.lighthouse}">보통 10~20초 걸립니다. 끝까지 내려 보고, PC 화면과 휴대폰 화면을 차례로 확인합니다.</p>
  </section>

  <!-- 실패 -->
  <section class="card" th:if="${job.status.name() == 'FAILED'}">
    <h1>검사에 실패했습니다</h1>
    <p class="target" th:text="${job.url}">https://www.example.com</p>
    <p class="form-error" th:text="${job.error}">오류 내용</p>
    <a class="btn btn-primary" th:href="@{/}">처음으로</a>
  </section>
</main>

<script th:unless="${job.finished}" th:inline="javascript">
  // 1초마다 진행 상태를 확인해 막대를 채우고, 끝나면 새로고침해서 결과 화면을 연다.
  const statusUrl = /*[[@{/api/scans/{id}(id=${job.id})}]]*/ '';
  const progressEl = document.getElementById('progress');
  const pctEl = document.getElementById('pct');
  const stepEl = document.getElementById('step-text');
  const bar = document.getElementById('pbar');
  const fill = document.getElementById('pbar-fill');
  async function poll() {
    try {
      const res = await fetch(statusUrl, { cache: 'no-store' });
      const s = await res.json();
      // 실행기 메시지 앞의 "[페이지 3 / 9]"는 막대 옆에 따로 보여 주므로 뺀다
      // (주의: 이 화면은 Thymeleaf가 스크립트 안의 대괄호 두 개를 식으로 읽으므로 정규식에 대괄호를 연달아 쓰지 않는다)
      progressEl.textContent = (s.progress || '').replace(/^\[.*?\]\s*/, '');
      if (stepEl.textContent !== s.stepText) stepEl.textContent = s.stepText;
      // 페이지를 찾는 중에는 끝을 모르므로 숫자 대신 '찾은 개수'만 보여 준다
      pctEl.textContent = s.indeterminate ? '' : s.percent + '%';
      fill.style.width = s.percent + '%';
      bar.setAttribute('aria-valuenow', s.percent);
      bar.classList.toggle('is-indeterminate', !!s.indeterminate);
      if (s.finished) { setTimeout(() => location.reload(), 400); return; }
    } catch (e) { /* 잠깐 끊겨도 다시 시도 */ }
    setTimeout(poll, 1000);
  }
  setTimeout(poll, 500);
</script>
</body>
</html>
