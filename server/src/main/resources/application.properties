spring.application.name=webops-server

# 내 PC에서만 접속 가능 (다른 PC에서 접속 불가)
server.address=127.0.0.1
server.port=8080

# 화면(HTML)을 고치면 서버 재시작 없이 새로고침만으로 반영
spring.thymeleaf.cache=false
spring.web.resources.chain.cache=false

# 검사 실행기(runner) 위치와 실행 명령 (server 폴더 기준 상대 경로)
webops.runner.dir=../runner
webops.runner.node=node
# 동시에 돌릴 수 있는 검사 수, 검사 1건 제한 시간(초)
webops.runner.max-concurrent=2
webops.runner.timeout-seconds=180

# 127.0.0.1·사설 IP 같은 내부 주소 검사 허용 여부 (기본: 차단)
# 테스트 페이지(127.0.0.1:4173)를 검사하려면 true로 바꾸거나 실행 시 --webops.scan.allow-private-targets=true
webops.scan.allow-private-targets=false
