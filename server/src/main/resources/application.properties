spring.application.name=webops-server

# 내 PC에서만 접속 가능 (다른 PC에서 접속 불가)
server.address=127.0.0.1
server.port=8080
# 세션 번호를 주소(;jsessionid=...)에 붙이지 않고 쿠키로만 (주소에 붙으면 화면이 깨지고 보안에도 좋지 않음)
server.servlet.session.tracking-modes=cookie

# 화면(HTML)을 고치면 서버 재시작 없이 새로고침만으로 반영
spring.thymeleaf.cache=false
spring.web.resources.chain.cache=false

# 검사 실행기(runner) 위치와 실행 명령 (server 폴더 기준 상대 경로)
webops.runner.dir=../runner
webops.runner.node=node
# 동시에 돌릴 수 있는 검사 수, 검사 1건 제한 시간(초)
webops.runner.max-concurrent=2
webops.runner.timeout-seconds=180
# 웹사이트 전체 점검: 페이지가 하나 늘 때마다 더 주는 시간(초), 안전 상한(최대 페이지 수), 동시에 여는 탭 수(1~5)
webops.runner.per-page-seconds=45
webops.scan.max-pages=300
webops.runner.site-concurrency=3
# PDF 보고서 만들기 제한 시간(초)
webops.runner.pdf-timeout-seconds=90

# ---------- 검사 기록 저장 (DB) ----------
# 지금은 설치가 필요 없는 H2 파일 DB (WebOps\data\webops.mv.db). 서버를 꺼도 기록이 남는다.
# 회사 DBMS로 바꿀 때: pom.xml에 그 DB 드라이버를 넣고 아래 url·username·password만 바꾼다.
#   예) Oracle  jdbc:oracle:thin:@호스트:1521/서비스명
#       MySQL   jdbc:mysql://호스트:3306/webops
spring.datasource.url=jdbc:h2:file:../data/webops;MODE=LEGACY
spring.datasource.username=sa
spring.datasource.password=
# 테이블은 프로그램이 알아서 만들고, 컬럼이 늘면 추가한다 (운영 DB에서는 validate로 바꾸고 DDL을 따로 관리)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# DB 관리 화면: http://127.0.0.1:8080/h2-console (JDBC URL은 위 datasource.url 그대로, 사용자 sa, 비밀번호 없음)
# 내 PC에서만 열리는 개발용. 다른 PC에서 접속하게 하거나 운영할 때는 반드시 false로.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- 정기 검사 ----------
# 검사할 때가 된 사이트가 있는지 확인하는 간격(밀리초)
webops.schedule.check-interval-ms=30000

# ---------- 문제 발생 알림 메일 ----------
# 메일 서버(SMTP)를 넣으면 알림 메일을 보낸다. 비워 두면 보내지 않고 '알림 기록'에만 남긴다.
#spring.mail.host=smtp.회사도메인
#spring.mail.port=587
#spring.mail.username=
#spring.mail.password=
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true
webops.alert.from=webops@localhost
# 메일 안 '결과 보기' 링크의 앞부분 (다른 PC에서 열 수 있는 주소로)
webops.alert.base-url=http://127.0.0.1:8080

# 127.0.0.1·사설 IP 같은 내부 주소 검사 허용 여부 (기본: 차단)
# 테스트 페이지(127.0.0.1:4173)를 검사하려면 true로 바꾸거나 실행 시 --webops.scan.allow-private-targets=true
webops.scan.allow-private-targets=false
