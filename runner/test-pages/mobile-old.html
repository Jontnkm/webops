<!doctype html>

<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>WebOps 테스트 - PC 전용 페이지</title>
  <style>.tiny { font-size: 10px; }</style>
</head>
<body>
  <h1>PC 전용 페이지</h1>
  <p class="tiny">작은 글자 1</p><p class="tiny">작은 글자 2</p><p class="tiny">작은 글자 3</p>
  <p class="tiny">작은 글자 4</p><p class="tiny">작은 글자 5</p><p class="tiny">작은 글자 6</p>
</body>
</html>
